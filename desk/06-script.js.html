/* ---------- toast + copy ---------- */
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
function copy(v){
  const fb=()=>{const a=document.createElement('textarea');a.value=v;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();toast(ok?'Copied '+v:'Copy failed: '+v)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(()=>toast('Copied '+v),fb);else fb();
}

/* ---------- boot sequence ---------- */
const SEQ={
  code:{text:'RYAN',fs:3.2,steps:['s-term','s-metal','s-graf','s-script','s-serif'],start:0},
  center:{text:'RYAN HURD',fs:2.6,steps:['s-graf','s-metal','s-script','s-term','s-serif','s-graf'],start:350},
  projects:{text:'RYAN HURD',fs:2.6,steps:['s-serif','s-term','s-graf','s-script','s-metal','s-graf'],start:700}
};
let bootId=0;
const mons=()=>$$('.mon');
function flash(scr){const f=$('.fl',scr);f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function finishMon(m){const scr=$('.scr',m);$('.gl',m).hidden=true;scr.classList.add('on')}
async function bootMon(m,cfg,id){
  const scr=$('.scr',m),gl=$('.gl',m),g=$('.g',m);
  scr.classList.remove('on');gl.hidden=false;g.textContent=cfg.text;g.dataset.text=cfg.text;g.style.setProperty('--fs',cfg.fs);g.className='g';
  await wait(cfg.start);
  for(const s of cfg.steps){
    if(id!==bootId)return;
    g.className='g jit '+s;flash(scr);await wait(170);
    if(id!==bootId)return;
    g.classList.remove('jit');await wait(430);
  }
  if(id!==bootId)return;
  flash(scr);await wait(120);
  if(id===bootId)finishMon(m);
}
function boot(){
  const id=++bootId;
  if(reduced){mons().forEach(finishMon);return}
  mons().forEach(m=>bootMon(m,SEQ[m.dataset.app],id));
}

/* ---------- overlay ---------- */
const AR={code:.6,center:1.6,projects:1.6,phone:.5};
let opener=null,curApp=null;
const ov=$('#ov'),frame=$('#frame');
function setApp(name){
  curApp=name;setTok(APP_TOK[name]);
  $$('#display > .app').forEach(a=>a.hidden=a.dataset.app!==name);
  frame.style.setProperty('--ar',AR[name]);
  frame.setAttribute('aria-label',{code:'Code monitor',center:'Desktop monitor',projects:'Projects monitor',phone:'Phone'}[name]);
}
function openApp(name,from,win){
  closePop();
  if(!ov.hidden){setApp(name);initApp(name,win);return}
  opener=from||document.activeElement;
  ov.hidden=false;document.body.classList.add('lock');syncHome();
  setApp(name);initApp(name,win);
  const src=(from&&from.getBoundingClientRect)?from.getBoundingClientRect():null;
  if(src&&src.width&&!reduced){
    const to=frame.getBoundingClientRect();
    frame.animate([{transform:'translate('+(src.left+src.width/2-to.left-to.width/2)+'px,'+(src.top+src.height/2-to.top-to.height/2)+'px) scale('+(src.width/to.width)+','+(src.height/to.height)+')',opacity:.5},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'});
  }
  $('#close').focus();
}
function closeApp(){
  if(ov.hidden)return;
  if(curApp==='code'||curApp==='projects'){setApp('center');initApp('center');return}
  const done=()=>{ov.hidden=true;document.body.classList.remove('lock');syncHome();setTok(STOP_TOK[si]);if(opener&&opener.focus&&document.contains(opener))opener.focus()};
  const src=opener&&opener.getBoundingClientRect?opener.getBoundingClientRect():null;
  if(src&&src.width&&!reduced&&opener.classList&&opener.classList.contains('mon')){
    const to=frame.getBoundingClientRect();
    frame.animate([{transform:'none',opacity:1},{transform:'translate('+(src.left+src.width/2-to.left-to.width/2)+'px,'+(src.top+src.height/2-to.top-to.height/2)+'px) scale('+(src.width/to.width)+','+(src.height/to.height)+')',opacity:.3}],{duration:280,easing:'ease-in'}).onfinish=done;
  }else done();
}
$('#close').addEventListener('click',closeApp);
ov.addEventListener('click',e=>{if(e.target===ov)closeApp()});
mons().forEach(m=>m.addEventListener('click',()=>openApp(m.dataset.app,m)));
function initApp(name,win){
  if(name==='code'){const narrow=$('#display').clientWidth<560;$('#exp').classList.toggle('closed',narrow);$('#tgExp').setAttribute('aria-pressed',!narrow);if(win){openFile(win)}}
  if(name==='center'){initOS();if(win)openWin(win)}
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('#pop').hidden){closePop();return}
    if(!$('#start').hidden){$('#start').hidden=true;return}
    closeApp();
  }
  if(e.key==='Tab'&&!ov.hidden){
    const f=$$('button,a[href],input,textarea,summary,[tabindex="0"]',ov).filter(x=>x.offsetParent!==null&&!x.disabled);
    if(!f.length)return;
    const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
    else if(!ov.contains(document.activeElement)){e.preventDefault();a.focus()}
  }
});

const nm=p=>p.split('/').pop();
function hl(line,lang){
  let s=esc(line);
  if(lang==='json'){s=s.replace(/&quot;/g,'"').replace(/"([^"]+)"(\s*:)/g,'<span class="k">"$1"</span>$2').replace(/:\s*("[^"]*")/g,': <span class="s">$1</span>').replace(/^(\s*)("[^"<]*",?)$/,'$1<span class="s">$2</span>')}

    if(/^#{1,3} /.test(s))s='<span class="h">'+s+'</span>';
    else s=s.replace(/^(\s*-) /,'<span class="b">$1</span> ').replace(/`([^`]+)`/g,'<span class="c">`$1`</span>');
  }
  return s.replace(/(https?:\/\/[^\s)<"]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}

function openWin(id){

function drag(el){
  const h=$('.wt',el);
  h.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    const os=$('#os').getBoundingClientRect(),r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;
    h.setPointerCapture(e.pointerId);
    const mv=ev=>{el.style.left=Math.max(0,Math.min(os.width-r.width,ev.clientX-os.left-ox))+'px';el.style.top=Math.max(0,Math.min(os.height-r.height-40,ev.clientY-os.top-oy))+'px'};
    const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up)};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  });
}
function initTerm(el){
  const out=$('.to',el),inp=$('input',el),hist=[];let hi=0;
  const say=t=>{const d=document.createElement('div');d.textContent=t;out.appendChild(d);out.scrollTop=out.scrollHeight};
  const OPEN={resume:'resume',about:'resume',experience:'experience',education:'education',volunteer:'volunteer',games:'games'};
  const EXT={blog:'https://blog.hurd.cc/blog/',recipes:'https://blog.hurd.cc/recipes/',api:'https://api.hurd.cc/docs/',github:'https://github.com/rh7112'};
  say('Type "help" for commands.');
  const run=v=>{
    const [c,...a]=v.split(/\s+/),arg=(a[0]||'').toLowerCase();
    if(c==='help')say('help  whoami  ls  open <name>  contact  github  clear');
    else if(c==='whoami')say('Ryan Hurd - Software Engineer, Internal Tools & User Experience. Warsaw, IN.');
    else if(c==='ls')say('resume  experience  education  volunteer  games  code  contact  blog  recipes  api');
    else if(c==='contact')say('ryan@hurd.cc  ·  (352) 580-0408');
    else if(c==='github')say('https://github.com/rh7112');
    else if(c==='clear')out.innerHTML='';
    else if(c==='open'){
      if(OPEN[arg]){openWin(OPEN[arg]);say('opening '+arg)}
      else if(arg==='code'||arg==='projects'){say('opening '+arg);openApp(arg)}
      else if(arg==='contact'){say('opening phone');openApp('phone')}
      else if(EXT[arg]){window.open(EXT[arg],'_blank','noopener');say('opening '+EXT[arg])}
      else say('open what? try: ls');
    }else say('command not found: '+c);
  };
  $('form',el).addEventListener('submit',e=>{e.preventDefault();const v=inp.value.trim();inp.value='';if(!v)return;hist.push(v);hi=hist.length;say('$ '+v);run(v)});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'&&hist.length){hi=Math.max(0,hi-1);inp.value=hist[hi];e.preventDefault()}
    if(e.key==='ArrowDown'){hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||'';e.preventDefault()}
  });
  el.addEventListener('click',()=>inp.focus());
}

const cam=$('#cam'),stg=$('#stage');
let si=0,cs=1,ctx0=0,cty0=0;
function view(cx,cy,s){
  const W=stg.clientWidth,H=stg.clientHeight,cw=cam.offsetWidth,ch=cam.offsetHeight;
  cs=s;
  ctx0=Math.min(0,Math.max(W-cw*s,W/2-cx*(cw/1600)*s));
  cty0=Math.min(0,Math.max(H-ch*s,H/2-cy*(ch/900)*s));
  cam.style.transform='translate('+ctx0+'px,'+cty0+'px) scale('+s+')';
}
function stop(i){
  si=(i+STOPS.length)%STOPS.length;const p=STOPS[si];
  const mob=cam.offsetWidth>stg.clientWidth*1.2;
  view(p.cx,p.cy,mob?(si?Math.max(1.25,p.s*stg.clientWidth/cam.offsetWidth):1):p.s);
  $$('#tChips button').forEach((b,k)=>{b.setAttribute('aria-pressed',k===si);if(k===si&&b.scrollIntoView)b.scrollIntoView({inline:'center',block:'nearest'})});

}

(function(){
  let d=null,moved=false;
  stg.addEventListener('pointerdown',e=>{if((cam.offsetWidth*cs<=stg.clientWidth+1&&cam.offsetHeight*cs<=stg.clientHeight+1)||e.button!==0||e.target.closest('.trav'))return;d={x:e.clientX,y:e.clientY,tx:ctx0,ty:cty0};moved=false});
  addEventListener('pointermove',e=>{
    if(!d)return;
    const dx=e.clientX-d.x,dy=e.clientY-d.y;
    if(!moved&&Math.hypot(dx,dy)<5)return;
    moved=true;cam.classList.add('drag');
    const W=stg.clientWidth,H=stg.clientHeight;
    ctx0=Math.min(0,Math.max(W-cam.offsetWidth*cs,d.tx+dx));cty0=Math.min(0,Math.max(H-cam.offsetHeight*cs,d.ty+dy));
    cam.style.transform='translate('+ctx0+'px,'+cty0+'px) scale('+cs+')';
  });
  addEventListener('pointerup',()=>{d=null;cam.classList.remove('drag')});

})();

/* ---------- deep links: #token here; on the live site the same tokens are paths (desk.hurd.cc/code) ---------- */
const APP_TOK={code:'code',center:'desktop',projects:'projects',phone:'phone'};
const APP_STOP={code:3,center:4,projects:5,phone:7};
const STOP_TOK=['overview','bookshelf','degrees','left','center','right','desk','table','under'];
let routing=false;
/* Real hosts use clean paths (/code, /phone, ...); sandboxed previews fall back to #hash. A #hash always wins so in-page links still work. */
const PATHS=/(^|\.)hurd\.cc$|^(localhost|127\.0\.0\.1)$/.test(location.hostname);
function curTok(){try{const h=decodeURIComponent(location.hash.slice(1)).toLowerCase();if(h||!PATHS)return h;return decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g,'').toLowerCase()}catch(e){return ''}}
function setTok(t){if(routing||!t)return;try{const c=curTok();
  if(PATHS){if((c||'overview')!==t)history.pushState(null,'',t==='overview'?'/':'/'+t)}
  else if(c!==t)history.pushState(null,'','#'+t)}catch(e){}}
function route(){
  const t=curTok();routing=true;
  try{
    const app=Object.keys(APP_TOK).find(k=>APP_TOK[k]===t);
    if(t==='books'){stop(1);openApp('code',null,'books/favorites.md')}
    else if(t==='contact'){stop(APP_STOP.phone);openApp('phone',null)}
  else if(app){stop(APP_STOP[app]);openApp(app,null)}
    else{if(!ov.hidden){ov.hidden=true;document.body.classList.remove('lock')}stop(Math.max(0,STOP_TOK.indexOf(t)))}
  }finally{routing=false}
}
addEventListener('hashchange',route);
if(PATHS)addEventListener('popstate',route);

boot();
if(curTok())route();
